  <rect x="1000" y="1077" width="140" height="24" rx="12" fill="#f0f1f3" stroke="#9ca3af" stroke-width="1"/>
  <text x="1070" y="1093" font-size="10" font-weight="700" fill="#4b5563" text-anchor="middle" letter-spacing="0.3">ROADMAP</text>
  <text x="150" y="1118" font-size="12" fill="#717171">CI/CD, infrastructure-as-code, monitoring and error tracking for the full build</text>

  <rect x="150" y="1135" width="158" height="28" rx="14" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="229" y="1153" font-size="11" fill="#374151" text-anchor="middle">GitHub Actions CI/CD</text>
  <rect x="320" y="1135" width="113" height="28" rx="14" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="376" y="1153" font-size="11" fill="#374151" text-anchor="middle">Terraform IaC</text>
  <rect x="445" y="1135" width="119" height="28" rx="14" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="504" y="1153" font-size="11" fill="#374151" text-anchor="middle">Kubernetes HPA</text>
  <rect x="576" y="1135" width="158" height="28" rx="14" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="655" y="1153" font-size="11" fill="#374151" text-anchor="middle">Datadog + Prometheus</text>
  <rect x="746" y="1135" width="165" height="28" rx="14" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="828" y="1153" font-size="11" fill="#374151" text-anchor="middle">Sentry Error Tracking</text>

  <!-- ============ Footer note ============ -->
  <text x="600" y="1235" font-size="12" fill="#9ca3af" text-anchor="middle">Frontend build is documented in CLAUDE.md &amp; README.md.</text>
